controller_manager:
  ros__parameters:
    use_sim_time: true
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    robotiq_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_state_broadcaster:
  ros__parameters:
    use_local_topics: false
    # gz_ros2_control exports the physical follower-joint states with a *_mimic
    # suffix. The mimic publisher remaps those measured states to URDF joint names.
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
      - robotiq_85_left_knuckle_joint
      - robotiq_85_right_knuckle_joint_mimic
      - robotiq_85_left_inner_knuckle_joint_mimic
      - robotiq_85_right_inner_knuckle_joint_mimic
      - robotiq_85_left_finger_tip_joint_mimic
      - robotiq_85_right_finger_tip_joint_mimic
    # Omit interfaces to publish all exported states. Gripper effort is absent;
    # an explicit cross-product filter would prevent broadcaster activation.

arm_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity
    open_loop_control: false
    allow_integration_in_goal_trajectories: true
    state_publish_rate: 100.0
    # Best verified fixed-PID gains with computed feedforward and dynamic modeling:
    gains:
      shoulder_pan_joint: {p: 380.0, i: 8.0, d: 6.0, i_clamp: 50.0}
      shoulder_lift_joint: {p: 900.0, i: 23.90625, d: 14.0, i_clamp: 92.96875}
      elbow_joint: {p: 540.0, i: 15.0, d: 5.5, i_clamp: 40.0}
      wrist_1_joint: {p: 75.0, i: 3.75, d: 0.7, i_clamp: 15.0}
      wrist_2_joint: {p: 84.375, i: 4.6875, d: 0.4, i_clamp: 21.0}
      wrist_3_joint: {p: 40.0, i: 3.0, d: 0.020, i_clamp: 3.0}

robotiq_gripper_controller:
  ros__parameters:
    joints:
      - robotiq_85_left_knuckle_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
    open_loop_control: false
    allow_integration_in_goal_trajectories: true
