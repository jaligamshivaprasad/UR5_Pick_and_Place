controller_manager:
  ros__parameters:
    use_sim_time: true
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    robotiq_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController
joint_state_broadcaster:
  ros__parameters:
    use_local_topics: false
    joints:
    - shoulder_pan_joint
    - shoulder_lift_joint
    - elbow_joint
    - wrist_1_joint
    - wrist_2_joint
    - wrist_3_joint
    - robotiq_85_left_knuckle_joint
    - robotiq_85_right_knuckle_joint_mimic
    - robotiq_85_left_inner_knuckle_joint_mimic
    - robotiq_85_right_inner_knuckle_joint_mimic
    - robotiq_85_left_finger_tip_joint_mimic
    - robotiq_85_right_finger_tip_joint_mimic
arm_controller:
  ros__parameters:
    joints:
    - shoulder_pan_joint
    - shoulder_lift_joint
    - elbow_joint
    - wrist_1_joint
    - wrist_2_joint
    - wrist_3_joint
    command_interfaces:
    - effort
    state_interfaces:
    - position
    - velocity
    open_loop_control: false
    allow_integration_in_goal_trajectories: true
    gains:
      shoulder_pan_joint:
        p: 180.0
        i: 5.0
        d: 6.0
        i_clamp: 40.0
        ff_velocity_scale: 0.0
      shoulder_lift_joint:
        p: 550.0
        i: 20.0
        d: 15.0
        i_clamp: 75.0
        ff_velocity_scale: 0.0
      elbow_joint:
        p: 280.0
        i: 14.0
        d: 6.0
        i_clamp: 35.0
        ff_velocity_scale: 0.0
      wrist_1_joint:
        p: 50.0
        i: 3.5
        d: 0.75
        i_clamp: 12.0
        ff_velocity_scale: 0.0
      wrist_2_joint:
        p: 50.0
        i: 3.5
        d: 0.45
        i_clamp: 15.0
        ff_velocity_scale: 0.0
      wrist_3_joint:
        p: 8.0
        i: 0.8
        d: 0.07
        i_clamp: 4.0
        ff_velocity_scale: 0.0
robotiq_gripper_controller:
  ros__parameters:
    joints:
    - robotiq_85_left_knuckle_joint
    command_interfaces:
    - position
    state_interfaces:
    - position
    open_loop_control: false
    allow_integration_in_goal_trajectories: true
