controller_manager:
  ros__parameters:
    use_sim_time: true
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    position_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    robotiq_gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController
position_arm_controller:
  ros__parameters:
    joints:
    - shoulder_pan_joint
    - shoulder_lift_joint
    - elbow_joint
    - wrist_1_joint
    - wrist_2_joint
    - wrist_3_joint
    command_interfaces:
    - position
    state_interfaces:
    - position
    open_loop_control: true
    allow_integration_in_goal_trajectories: true
joint_state_broadcaster:
  ros__parameters:
    use_local_topics: false
    joints:
    - shoulder_pan_joint
    - shoulder_lift_joint
    - elbow_joint
    - wrist_1_joint
    - wrist_2_joint
    - wrist_3_joint
    - robotiq_85_left_knuckle_joint
    - robotiq_85_right_knuckle_joint_mimic
    - robotiq_85_left_inner_knuckle_joint_mimic
    - robotiq_85_right_inner_knuckle_joint_mimic
    - robotiq_85_left_finger_tip_joint_mimic
    - robotiq_85_right_finger_tip_joint_mimic
arm_controller:
  ros__parameters:
    joints:
    - shoulder_pan_joint
    - shoulder_lift_joint
    - elbow_joint
    - wrist_1_joint
    - wrist_2_joint
    - wrist_3_joint
    command_interfaces:
    - effort
    state_interfaces:
    - position
    - velocity
    open_loop_control: false
    allow_integration_in_goal_trajectories: true
    gains:
      shoulder_pan_joint:
        p: 350.0
        i: 2.0
        d: 18.0
        i_clamp: 10.0
        ff_velocity_scale: 0.0
      shoulder_lift_joint:
        p: 700.0
        i: 15.0
        d: 30.0
        i_clamp: 65.0
        ff_velocity_scale: 0.0
      elbow_joint:
        p: 450.0
        i: 12.0
        d: 20.0
        i_clamp: 30.0
        ff_velocity_scale: 0.0
      wrist_1_joint:
        p: 60.0
        i: 3.0
        d: 3.0
        i_clamp: 5.0
        ff_velocity_scale: 0.0
      wrist_2_joint:
        p: 50.0
        i: 2.0
        d: 2.0
        i_clamp: 3.0
        ff_velocity_scale: 0.0
      wrist_3_joint:
        p: 30.0
        i: 1.0
        d: 1.0
        i_clamp: 2.0
        ff_velocity_scale: 0.0
robotiq_gripper_controller:
  ros__parameters:
    joints:
    - robotiq_85_left_knuckle_joint
    command_interfaces:
    - position
    state_interfaces:
    - position
    open_loop_control: false
    allow_integration_in_goal_trajectories: true
